<title id="synthesis_collaboration-title">Synthesis: application, adapters and scientific rules</title><desc id="synthesis_collaboration-desc">Runtime collaboration from campaign composition to candidate execution and domain scoring, without importing infrastructure into core workflows.</desc>
<defs>
<marker id="synthesis_collaboration-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#333333"/></marker>
<marker id="synthesis_collaboration-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#d97706"/></marker>
<marker id="synthesis_collaboration-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f46e5"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111111}.heading{font-size:28px;font-weight:600}.name{font-size:16px;font-weight:600}.detail,.label{font-size:12px}.tag{font-size:8px;letter-spacing:.8px}.wire{fill:none;stroke:#333333;stroke-width:1.4;marker-end:url(#synthesis_collaboration-arrow)}</style>
</defs>
<rect width="1280" height="720" fill="#f2e6ff"/>
<text x="80" y="52" class="heading">Synthesis: application, adapters and scientific rules</text><text x="80" y="76" class="detail">Runtime calls / delegation, not Python imports · repositories, problem factory and client are injected collaborators.</text>
<g class="wire">
<path d="M400 156 H480"/><path d="M800 156 H880"/>
<path d="M1040 192 V280"/><path d="M880 316 H800"/><path d="M480 316 H400"/>
<path d="M240 352 V392 Q240 400 248 400 H632 Q640 400 640 408 V440"/>
<path d="M480 476 H248 Q240 476 240 484 V568"/>
<path d="M800 476 H1032 Q1040 476 1040 484 V568"/>
</g>
<g class="node"><rect x="80" y="120" width="320" height="72" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/><text x="96" y="135" class="tag">BOOTSTRAP / NOTEBOOK ENTRY</text><text x="96" y="154" class="name">build_synthesis_campaign</text><text x="96" y="171" class="detail">Construct concrete adapters</text><text x="96" y="185" class="detail">Load settings and wire interfaces</text></g>
<g class="node"><rect x="480" y="120" width="320" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="496" y="135" class="tag">EVOLUTION APPLICATION</text><text x="496" y="154" class="name">SynthesisCampaignCoordinator</text><text x="496" y="171" class="detail">CampaignAuditor + CampaignPlanner</text><text x="496" y="185" class="detail">Reconcile state and build CampaignTask payloads</text></g>
<g class="node"><rect x="880" y="120" width="320" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="896" y="135" class="tag">EVOLUTION INFRASTRUCTURE</text><text x="896" y="154" class="name">ProcessPoolRunner</text><text x="896" y="171" class="detail">Dispatch sessions to worker processes</text><text x="896" y="185" class="detail">Worker entry: run_synthesis_worker</text></g>
<g class="node"><rect x="880" y="280" width="320" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="896" y="295" class="tag">EVOLUTION APPLICATION</text><text x="896" y="314" class="name">SingleSynthesisUseCase</text><text x="896" y="331" class="detail">Worker-local repository + database</text><text x="896" y="345" class="detail">Execute one synthesis session</text></g>
<g class="node"><rect x="480" y="280" width="320" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="496" y="295" class="tag">EVOLUTION INFRASTRUCTURE</text><text x="496" y="314" class="name">LLaMEAEngine / LLaMEASession</text><text x="496" y="331" class="detail">Build prompts; restore trusted checkpoints</text><text x="496" y="345" class="detail">Run LLaMEA using the Evaluator callback</text></g>
<g class="node"><rect x="80" y="280" width="320" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="96" y="295" class="tag">EVOLUTION INFRASTRUCTURE</text><text x="96" y="314" class="name">Evaluator</text><text x="96" y="331" class="detail">Translate LLaMEA Solution into code evaluation</text><text x="96" y="345" class="detail">Persist code / iterations; attach fitness / feedback</text></g>
<g class="node"><rect x="480" y="440" width="320" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="496" y="455" class="tag">EVOLUTION APPLICATION</text><text x="496" y="474" class="name">CandidateEvaluationService</text><text x="496" y="491" class="detail">Execute through CandidateExecutor interface</text><text x="496" y="505" class="detail">Validate, clean-score and assemble diagnostics</text></g>
<g class="node"><rect x="80" y="568" width="320" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="96" y="583" class="tag">SHARED INFRASTRUCTURE</text><text x="96" y="602" class="name">AlgorithmExecutorAdapter</text><text x="96" y="619" class="detail">Shared executor: compile, run, capture warnings</text><text x="96" y="633" class="detail">func_timeout; require (best_x, best_y)</text></g>
<g class="node"><rect x="880" y="568" width="320" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="896" y="583" class="tag">EVOLUTION DOMAIN</text><text x="896" y="602" class="name">AlgorithmScoringService</text><text x="896" y="619" class="detail">Uses shared objective_gap(clean_y, f_opt)</text><text x="896" y="633" class="detail">Evolution owns fitness and failure penalties</text></g>
<line x1="80" y1="664" x2="1200" y2="664" stroke="#c8bad8"/>
<text x="80" y="692" class="detail">Indigo: composition · Blue: evolution application / domain · Amber: runtime adapters · Feedback returns through Evaluator</text>
</svg>
