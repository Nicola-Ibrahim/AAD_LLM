<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="candidate_evaluation-title candidate_evaluation-desc">
<title id="candidate_evaluation-title">Synthesis candidate evaluation: success and failure</title><desc id="candidate_evaluation-desc">Synthesis candidate execution validates its tuple and returned coordinates and clean-scores the point, or records a caught execution or validation failure.</desc>
<defs>
<marker id="candidate_evaluation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#333333"/></marker>
<marker id="candidate_evaluation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#d97706"/></marker>
<marker id="candidate_evaluation-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f46e5"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111111}.heading{font-size:28px;font-weight:600}.name{font-size:16px;font-weight:600}.detail,.label{font-size:12px}.tag{font-size:8px;letter-spacing:.8px}.wire{fill:none;stroke:#333333;stroke-width:1.4;marker-end:url(#candidate_evaluation-arrow)}</style>
</defs>
<rect width="1280" height="720" fill="#f2e6ff"/>
<text x="80" y="52" class="heading">Synthesis candidate evaluation: success and failure</text><text x="80" y="76" class="detail">The decision summarizes the surrounding try / except: compilation, execution, validation and scoring can raise.</text>
<g class="wire">
<path d="M640 168 V208"/><path d="M640 280 V320"/><path d="M640 392 V416"/>
<path d="M520 456 H248 Q240 456 240 464 V552"/>
<path d="M760 456 H1032 Q1040 456 1040 464 V552"/>
</g>
<rect x="392" y="428" width="64" height="20" fill="#f2e6ff"/><text x="424" y="442" class="label" text-anchor="middle">YES</text>
<rect x="824" y="428" width="64" height="20" fill="#f2e6ff"/><text x="856" y="442" class="label" text-anchor="middle">NO</text>
<g class="node"><rect x="480" y="96" width="320" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="496" y="111" class="tag">SYNTHESIS CANDIDATE EVALUATION</text><text x="496" y="130" class="name">Candidate code + problem + budget</text><text x="496" y="147" class="detail">CandidateEvaluationService resets the problem</text><text x="496" y="161" class="detail">Attempt the following steps inside try / except</text></g>
<g class="node"><rect x="480" y="208" width="320" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="496" y="223" class="tag">SHARED EXECUTION</text><text x="496" y="242" class="name">Compile and execute</text><text x="496" y="259" class="detail">Timeout guard + warning capture</text><text x="496" y="273" class="detail">Require tuple (best_x, finite best_y)</text></g>
<g class="node"><rect x="480" y="320" width="320" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="496" y="335" class="tag">SYNTHESIS APPLICATION</text><text x="496" y="354" class="name">Validate point and clean-score</text><text x="496" y="371" class="detail">Check dimension and bounds (tolerance 1e-5)</text><text x="496" y="385" class="detail">Evaluate returned best_x; require finite clean_y</text></g>
<g class="node"><polygon points="640,416 760,456 640,496 520,456" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/><text x="640" y="462" text-anchor="middle" class="name">Caught exception?</text></g>
<g class="node"><rect x="80" y="552" width="320" height="72" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="96" y="567" class="tag">EVOLUTION FITNESS POLICY</text><text x="96" y="586" class="name">Failure result</text><text x="96" y="603" class="detail">Timeout -4.0e8; numerical/type errors -4.5e8</text><text x="96" y="617" class="detail">Other execution errors -5.0e8; record diagnostics</text></g>
<g class="node"><rect x="880" y="552" width="320" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="896" y="567" class="tag">SHARED GAP / EVOLUTION FITNESS</text><text x="896" y="586" class="name">Successful execution result</text><text x="896" y="603" class="detail">gap = max(0, clean_y - f_opt); fitness = -gap</text><text x="896" y="617" class="detail">Valid execution does not necessarily mean solved</text></g>
<line x1="80" y1="664" x2="1200" y2="664" stroke="#c8bad8"/>
<text x="80" y="692" class="detail">Blue: application steps · Amber: shared executor · Indigo: outcome decision · Rose: failure · Mint: finite result</text>
</svg>
