# ==============================================================================
# LLaMEA Evolutionary Synthesis Configuration (Stage 1: Notebooks 01-02)
# ==============================================================================
# Single source of truth for the experimental synthesis search space,
# evolutionary hyperparameters, prompt engineering strategies, and worker execution.

# ==============================================================================
# 1. WHAT TO SYNTHESIZE (Search Space Matrix)
# ==============================================================================
[matrix]
# Target BBOB Problem Suite IDs & Evaluated Dimensionalities (Option 3):
#   1  : Sphere (Separable, smooth, unimodal)
#   8  : Rosenbrock (Moderate conditioning, curved valley)
#   11 : Discus (High conditioning, asymmetric ridge)
#   15 : Rastrigin (Strong multi-modal, highly rugged)
#   21 : Gallagher 101 (Weak multi-modal, deceptive Gaussian peaks)
problem_targets = [
  { id = 1,  dimensions = [2, 3, 5] },
  { id = 8,  dimensions = [2, 3, 5] },
  { id = 11, dimensions = [2, 3, 5] },
  { id = 15, dimensions = [2, 3, 5] },
  { id = 21, dimensions = [2, 3, 5] },
]

# Evaluated Noise Conditions (Pairs of standard deviation and noise model strategy):
# Supported models: "none", "heteroscedastic", "homoscedastic_additive", "awgn"
noise_conditions = [
  { std = 0.0,  model = "none" },
  { std = 0.05, model = "heteroscedastic" },
  { std = 0.1,  model = "heteroscedastic" },
  { std = 0.2,  model = "heteroscedastic" },
]

# Evaluated Synthesis Modes & Prompt Strategies (List of dictionaries with strategies list):
#   • "clean"    : Evaluated on deterministic landscapes (std = 0.0) with clean landscape characteristics
#   • "noisy"    : Evaluated on noisy landscapes (std > 0.0) with explicit stochasticity warnings
#   • "implicit" : Evaluated on noisy landscapes (std > 0.0) with neutral black-box prompt for autonomous noise discovery
synthesis_modes = [
  { mode = "clean",    strategies = ["baseline", "thinking", "vectorization", "guided"] },
  { mode = "noisy",    strategies = ["baseline", "thinking", "vectorization", "guided"] },
  { mode = "implicit", strategies = ["baseline", "thinking", "vectorization", "guided"] },
]

# ==============================================================================
# 2. EVOLUTIONARY SYNTHESIS SETTINGS
# ==============================================================================
[evolution]
# Evolutionary Generations: Number of LLaMEA mutation/selection iterations per session
#   • 10  = Standard full synthesis run
#   • 2-3 = Fast quick-test / dry-run
iterations = 10

# Function Evaluation Budget: Max objective evaluations per candidate algorithm
budget = 1000000

# Statistical Replicates: Number of independent repeat runs per unique matrix configuration
#   • 1   = Single execution per condition (extracting the best champion algorithm)
runs_per_config = 1

# ==============================================================================
# 3. EXECUTION & RECOVERY (How Tasks Run in Parallel)
# ==============================================================================
[execution]
# Process Pool Concurrency: Number of parallel worker processes (0 = os.cpu_count())
max_workers = 0

# Fault Tolerance & Auto-Resume:
auto_resume = true
skip_completed = true
retry_failed_synthesis = true
