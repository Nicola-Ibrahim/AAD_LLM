# ==============================================================================
# LLaMEA Evolutionary Synthesis Configuration (Stage 1: Notebooks 01-02)
# ==============================================================================
# Single source of truth for the experimental synthesis search space,
# evolutionary hyperparameters, prompt engineering strategies, and worker execution.

# ==============================================================================
# 1. WHAT TO SYNTHESIZE (Search Space Matrix)
# ==============================================================================
[matrix]
# Target BBOB Problem Suite IDs:
#   1  : Sphere (Separable, smooth, unimodal)
#   8  : Rosenbrock (Moderate conditioning, curved valley)
#   11 : Discus (High conditioning, asymmetric ridge)
#   15 : Rastrigin (Strong multi-modal, highly rugged)
#   21 : Gallagher 101 (Weak multi-modal, deceptive Gaussian peaks)
problem_ids = [1, 8, 11, 15, 21]

# Evaluated Search Space Dimensionalities (D):
dimensions = [2, 3, 5]

# Noise Levels (Standard Deviation):
#   • 0.0  = Clean Ground-Truth (No Noise)
#   • 0.05 = Stochastic Noise Injection
noise_stds = [0.0, 0.05]

# Noise Injection Model Strategy:
#   • "heteroscedastic"       : Multiplicative noise N(y, (noise_std * |y - y*|)^2)
#   • "homoscedastic_additive": Landscape-scaled additive Gaussian noise
#   • "awgn"                  : Constant-variance Additive White Gaussian Noise
#   • "none"                  : No noise injection
noise_model = "heteroscedastic"

# Prompt Engineering Strategies evaluated during algorithm synthesis:
# Options: "baseline", "thinking", "vectorization", "guided"
prompt_strategies = ["baseline", "thinking", "vectorization", "guided"]

# ==============================================================================
# 2. EVOLUTIONARY SYNTHESIS SETTINGS
# ==============================================================================
[evolution]
# Evolutionary Generations: Number of LLaMEA mutation/selection iterations per session
#   • 10  = Standard full synthesis run
#   • 2-3 = Fast quick-test / dry-run
iterations = 10

# Function Evaluation Budget: Max objective evaluations per candidate algorithm
budget = 1000000

# Statistical Replicates: Number of independent repeat runs per unique matrix configuration
#   • 1   = Single execution per condition (extracting the best champion algorithm)
runs_per_config = 1

# ==============================================================================
# 3. EXECUTION & RECOVERY (How Tasks Run in Parallel)
# ==============================================================================
[execution]
# Process Pool Concurrency: Number of parallel worker processes (0 = os.cpu_count())
max_workers = 0

# Fault Tolerance & Auto-Resume:
auto_resume = true
skip_completed = true
retry_failed_synthesis = true
