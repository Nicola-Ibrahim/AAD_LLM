# ==============================================================================
# Benchmark & Evaluation Configuration (Notebooks 03-05)
# ==============================================================================
# Settings for systematic multi-trial evaluations of LLaMEA Champions & Classical Baselines.

[evaluation]
# Standard independent benchmark evaluation runs per condition for champions & baselines (N=10)
target_eval_runs = 10

# Per-run execution wall-clock timeout in seconds
eval_timeout_seconds = 30.0

# fill_missing_only:
#   • true  = Scans data/ioh_logs and executes ONLY missing / partial runs (< 10)
#   • false = Re-evaluates based on notebook filter settings
fill_missing_only = true

# Classical Baselines evaluated on identical benchmark problems
classical_baselines = ["CMA-ES", "DE", "PSO"]
