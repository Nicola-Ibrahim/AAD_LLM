# ==============================================================================
# Independent Empirical Benchmarking Configuration (Stage 2: Notebooks 03-05)
# ==============================================================================
# Settings for systematic multi-trial IOHprofiler evaluations of LLaMEA Champions & Classical Baselines.

[benchmarking]
# Target independent benchmark evaluation runs per condition (e.g., 10, 15, 20)
target_eval_runs = 20

# Trials use paired BBOB instance IDs and optimizer/noise seeds derived from this base.
random_seed = 42

# Budget multiplier per dimension (Budget = dim * budget_multiplier, e.g. 5D * 10,000 = 50,000 evaluations)
budget_multiplier = 10000

# Per-trial execution wall-clock timeout in seconds
eval_timeout_seconds = 30.0

# Execution & Auto-Resume Control:
#   • force_rerun = false: Automatically resumes from existing runs (e.g. runs 11..20) and skips completed
#   • force_rerun = true:  Wipes existing traces and re-evaluates all 20 runs from scratch
force_rerun = false

# Classical Baselines evaluated on identical benchmark problems
classical_baselines = ["cmaes", "de", "pso"]

# ==============================================================================
# Fixed-target LLM reliability analysis (Notebooks 03 and 05)
# ==============================================================================
[benchmarking.reliability]
# Only this common strategy enters the headline LLM comparison. Other strategies
# remain available as a separately labelled ablation.
primary_prompt_strategy = "baseline"
primary_target = 1e-8
secondary_target = 1e-2
bootstrap_samples = 1000
bootstrap_seed = 20260923
checkpoint_fractions = [0.01, 0.1, 0.5, 1.0]
# Models are derived from completed result folders/database records, so future
# LLMs appear automatically. Missing conditions are never scored as failures.
discover_models = true
incomplete_condition_policy = "exclude"
