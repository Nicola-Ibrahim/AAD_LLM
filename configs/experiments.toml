# ==============================================================================
# LLaMEA Unified Experiment & Runner Configuration
# ==============================================================================
# Single source of truth for the experimental search space, evolution parameters,
# execution concurrency, and benchmark evaluation settings.

# ==============================================================================
# 1. WHAT TO RUN (Search Space Matrix)
# ==============================================================================
# Edit these lists to specify exactly which problems, dimensions, or modes to run.
[matrix]
# Target BBOB Problem Suite IDs:
#   1  : Sphere (Separable, smooth, unimodal)
#   8  : Rosenbrock (Moderate conditioning, curved valley)
#   11 : Discus (High conditioning, asymmetric ridge)
#   15 : Rastrigin (Strong multi-modal, highly rugged)
#   21 : Gallagher 101 (Weak multi-modal, deceptive Gaussian peaks)
problem_ids = [1, 8, 11, 15, 21]

# Evaluated Search Space Dimensionalities (D):
dimensions = [2, 3, 5]

# Noise Levels (Standard Deviation):
#   • 0.0  = Clean Ground-Truth (No Noise)
#   • 0.05 = Stochastic Noise Injection
noise_stds = [0.0, 0.05]

# Noise Injection Model Strategy:
#   • "heteroscedastic"       : Multiplicative noise N(y, (noise_std * |y - y*|)^2)
#   • "homoscedastic_additive": Landscape-scaled additive Gaussian noise
#   • "awgn"                  : Constant-variance Additive White Gaussian Noise
#   • "none"                  : No noise injection
noise_model = "heteroscedastic"

# Prompt Engineering Strategies evaluated during algorithm synthesis:
# Options: "baseline", "thinking", "vectorization", "guided"
prompt_strategies = ["baseline", "thinking", "vectorization", "guided"]

# ==============================================================================
# 2. EVOLUTION SETTINGS
# ==============================================================================
[evolution]
# Evolutionary Generations: Number of LLaMEA mutation/selection iterations per experiment run
#   • 10  = Standard full search run
#   • 2-3 = Fast quick-test / dry-run
iterations = 10

# Function Evaluation Budget: Max objective evaluations per candidate algorithm
budget = 1000000

# Statistical Replicates: Number of independent repeat runs per unique matrix configuration
#   • 1   = Single execution per condition (extracting the best champion algorithm)
#   • 3-5 = Statistical replicates across seeds
runs_per_config = 1

# ==============================================================================
# 3. EXECUTION & RECOVERY (How Tasks Run in Parallel)
# ==============================================================================
[execution]
# Process Pool Concurrency: Number of parallel worker processes (0 = os.cpu_count())
max_workers = 8

# auto_resume: Crash-recovery mechanism
#   • true  = Queries DB for interrupted runs (status='running') and resumes from their last iteration
#   • false = Ignores interrupted runs and schedules only fresh ones
auto_resume = true

# skip_completed: State deduplication
#   • true  = Checks DB and skips configurations that already completed with a valid finite error
#   • false = Forces re-running everything
skip_completed = true

# retry_failed_synthesis: Re-synthesize conditions where 0 working algorithms were found
#   • true  = Automatically detects completed runs that failed all iterations (best_final_error is null/inf)
#             and re-executes them to find a working champion algorithm
#   • false = Treats any completed experiment in DB as finished regardless of candidate failure
retry_failed_synthesis = true

# only_incomplete: Recovery / triage mode
#   • true  = ONLY finishes interrupted runs that crashed mid-way
#   • false = Finishes interrupted runs AND executes all remaining pending matrix tasks
only_incomplete = false

# target_experiment_ids: Re-run specific DB experiment IDs (leave empty [] to run entire configured matrix)
# e.g., [112, 64, 36] to re-run exact DB experiment rows
target_experiment_ids = []
